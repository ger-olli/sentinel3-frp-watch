name: Sentinel-3 FRP Hotspot Watch v3

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r s3-requirements.txt

      - name: Query Copernicus Sentinel-3 FRP
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
        run: python s3_watch.py

      - name: Publish Sentinel-3 status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/s3_status.json data/s3_seen.json data/s3_events.jsonl data/s3_cursor.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Sentinel-3 FRP hotspot status"
            git push
          fi
